<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="View">
          <!-- Shift+middle button orbits, middle button pans, wheel zooms, as in Fusion. -->
          <FCText Name="NavigationStyle">Gui::RevitNavigationStyle</FCText>
        </FCParamGroup>
        <FCParamGroup Name="Shortcut">
          <!-- Only commands FuCad does not already give a Fusion-like key. -->
          <FCText Name="Sketcher_CreateArc">A</FCText>
          <FCText Name="PartDesign_Chamfer">Shift+F</FCText>
          <FCText Name="PartDesign_NewSketch">Shift+S</FCText>
          <FCText Name="Std_TransformManip">M</FCText>
          <FCText Name="Std_ViewFitAll">F6</FCText>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
