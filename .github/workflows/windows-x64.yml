# Windows x64 build of this fork (with its fixes, e.g. the Sketcher crash on a
# language change), using FuCad's own LibPack-based Windows packaging. Builds the
# commit of this branch; merge upstream main into it before running.
name: Windows x64

on:
  workflow_dispatch:
  schedule:
    # Thursday, after upstream's Wednesday weekly tag.
    - cron: "0 9 * * 4"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create the release the build uploads to
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="win64-$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FuCad Windows x64 $tag" \
            --notes "Unofficial Windows x64 build of this fork (branch arm64-build, ${GITHUB_SHA::10}), built with FuCad's LibPack packaging. Unsigned. Includes the fork's fixes, e.g. no crash when switching the language."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    uses: ./.github/workflows/sub_releaseWindowsLibpack.yml
    with:
      build_tag: ${{ needs.release.outputs.tag }}
      arch: x86_64
      runner: windows-2022
      cmakeArchitecture: ""
      makeInstaller: "true"
      libpackDownloadUrl: https://github.com/FreeCAD/FreeCAD-LibPack/releases/download/3.5.3/LibPack-26.3.0-v3.5.3-x64-Release.7z
      libpackName: LibPack-26.3.0-v3.5.3-x64-Release
    secrets: inherit
